<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 231" width="200" height="231">
  <defs>
    <clipPath id="hex-clip-a">
      <polygon points="100,2 193,59 193,172 100,229 7,172 7,59"/>
    </clipPath>
  </defs>

  <!-- Hex background -->
  <polygon points="100,2 193,59 193,172 100,229 7,172 7,59"
           fill="#1F3B73" stroke="#0F1F40" stroke-width="3"/>

  <g clip-path="url(#hex-clip-a)">
    <!-- Scale 1.2x, re-center: scale around (90,94) then place at (104,110) -->
    <g transform="translate(104,100) scale(1.2) translate(-90,-94)">

    <!-- === EDGES: fist silhouette network === -->
    <g stroke="#5A8AC4" stroke-width="1.2" stroke-opacity="0.55" fill="none">

      <!-- Pinky finger (leftmost) -->
      <line x1="52" y1="62" x2="48" y2="74"/>
      <line x1="48" y1="74" x2="47" y2="87"/>
      <line x1="47" y1="87" x2="50" y2="98"/>

      <!-- Ring finger -->
      <line x1="68" y1="52" x2="65" y2="65"/>
      <line x1="65" y1="65" x2="63" y2="79"/>
      <line x1="63" y1="79" x2="64" y2="93"/>

      <!-- Middle finger (tallest) -->
      <line x1="86" y1="44" x2="83" y2="58"/>
      <line x1="83" y1="58" x2="81" y2="72"/>
      <line x1="81" y1="72" x2="82" y2="87"/>

      <!-- Index finger -->
      <line x1="104" y1="48" x2="101" y2="62"/>
      <line x1="101" y1="62" x2="99" y2="76"/>
      <line x1="99" y1="76" x2="100" y2="90"/>

      <!-- Knuckle ridge connections (across finger tips curling over) -->
      <line x1="50" y1="98" x2="64" y2="93"/>
      <line x1="64" y1="93" x2="82" y2="87"/>
      <line x1="82" y1="87" x2="100" y2="90"/>

      <!-- Fingertip crosslinks (curled part) -->
      <line x1="52" y1="62" x2="68" y2="52"/>
      <line x1="68" y1="52" x2="86" y2="44"/>
      <line x1="86" y1="44" x2="104" y2="48"/>

      <!-- Mid-finger crosslinks -->
      <line x1="48" y1="74" x2="65" y2="65"/>
      <line x1="65" y1="65" x2="83" y2="58"/>
      <line x1="83" y1="58" x2="101" y2="62"/>

      <!-- Lower-finger crosslinks -->
      <line x1="47" y1="87" x2="63" y2="79"/>
      <line x1="63" y1="79" x2="81" y2="72"/>
      <line x1="81" y1="72" x2="99" y2="76"/>

      <!-- Palm area: broad connections below knuckles -->
      <line x1="50" y1="98" x2="46" y2="112"/>
      <line x1="64" y1="93" x2="62" y2="110"/>
      <line x1="82" y1="87" x2="80" y2="108"/>
      <line x1="100" y1="90" x2="102" y2="108"/>

      <!-- Palm horizontal band -->
      <line x1="46" y1="112" x2="62" y2="110"/>
      <line x1="62" y1="110" x2="80" y2="108"/>
      <line x1="80" y1="108" x2="102" y2="108"/>

      <!-- Lower palm -->
      <line x1="46" y1="112" x2="50" y2="128"/>
      <line x1="62" y1="110" x2="66" y2="126"/>
      <line x1="80" y1="108" x2="82" y2="125"/>
      <line x1="102" y1="108" x2="104" y2="124"/>

      <!-- Lower palm band -->
      <line x1="50" y1="128" x2="66" y2="126"/>
      <line x1="66" y1="126" x2="82" y2="125"/>
      <line x1="82" y1="125" x2="104" y2="124"/>

      <!-- Wrist -->
      <line x1="50" y1="128" x2="56" y2="142"/>
      <line x1="104" y1="124" x2="100" y2="142"/>
      <line x1="56" y1="142" x2="78" y2="144"/>
      <line x1="78" y1="144" x2="100" y2="142"/>
      <line x1="66" y1="126" x2="78" y2="144"/>
      <line x1="82" y1="125" x2="78" y2="144"/>

      <!-- Thumb: extends right from palm -->
      <line x1="102" y1="108" x2="118" y2="100"/>
      <line x1="118" y1="100" x2="132" y2="88"/>
      <line x1="132" y1="88" x2="140" y2="78"/>
      <line x1="140" y1="78" x2="138" y2="92"/>
      <line x1="138" y1="92" x2="130" y2="104"/>
      <line x1="130" y1="104" x2="118" y2="112"/>
      <line x1="118" y1="112" x2="104" y2="124"/>

      <!-- Thumb internal -->
      <line x1="118" y1="100" x2="138" y2="92"/>
      <line x1="132" y1="88" x2="130" y2="104"/>
      <line x1="118" y1="100" x2="130" y2="104"/>
      <line x1="118" y1="100" x2="118" y2="112"/>

      <!-- Palm diagonals for density -->
      <line x1="46" y1="112" x2="62" y2="126" stroke-opacity="0.35"/>
      <line x1="62" y1="110" x2="80" y2="125" stroke-opacity="0.35"/>
      <line x1="80" y1="108" x2="104" y2="124" stroke-opacity="0.35"/>
      <line x1="50" y1="98" x2="62" y2="110" stroke-opacity="0.35"/>
      <line x1="100" y1="90" x2="80" y2="108" stroke-opacity="0.35"/>
    </g>

    <!-- === NODES === -->
    <!-- Finger tips (top row) -->
    <g fill="white">
      <circle cx="52" cy="62" r="3.5"/>
      <circle cx="68" cy="52" r="3.5"/>
      <circle cx="86" cy="44" r="3.5"/>
      <circle cx="104" cy="48" r="3.5"/>
    </g>

    <!-- Finger upper joints -->
    <g fill="#A8C4F0">
      <circle cx="48" cy="74" r="2.8"/>
      <circle cx="65" cy="65" r="2.8"/>
      <circle cx="83" cy="58" r="2.8"/>
      <circle cx="101" cy="62" r="2.8"/>
    </g>

    <!-- Finger lower joints -->
    <g fill="#A8C4F0">
      <circle cx="47" cy="87" r="2.8"/>
      <circle cx="63" cy="79" r="2.8"/>
      <circle cx="81" cy="72" r="2.8"/>
      <circle cx="99" cy="76" r="2.8"/>
    </g>

    <!-- Knuckle ridge -->
    <g fill="white">
      <circle cx="50" cy="98" r="3.8"/>
      <circle cx="64" cy="93" r="3.8"/>
      <circle cx="82" cy="87" r="3.8"/>
      <circle cx="100" cy="90" r="3.8"/>
    </g>

    <!-- Upper palm -->
    <g fill="#7BA3D9">
      <circle cx="46" cy="112" r="3"/>
      <circle cx="62" cy="110" r="3"/>
      <circle cx="80" cy="108" r="3"/>
      <circle cx="102" cy="108" r="3"/>
    </g>

    <!-- Lower palm -->
    <g fill="#7BA3D9">
      <circle cx="50" cy="128" r="3"/>
      <circle cx="66" cy="126" r="3"/>
      <circle cx="82" cy="125" r="3"/>
      <circle cx="104" cy="124" r="3"/>
    </g>

    <!-- Wrist -->
    <g fill="#5A8AC4">
      <circle cx="56" cy="142" r="2.8"/>
      <circle cx="78" cy="144" r="2.8"/>
      <circle cx="100" cy="142" r="2.8"/>
    </g>

    <!-- Thumb nodes -->
    <g fill="white">
      <circle cx="140" cy="78" r="3.2"/>
    </g>
    <g fill="#A8C4F0">
      <circle cx="132" cy="88" r="2.8"/>
      <circle cx="118" cy="100" r="3"/>
      <circle cx="138" cy="92" r="2.5"/>
      <circle cx="130" cy="104" r="2.5"/>
      <circle cx="118" cy="112" r="2.8"/>
    </g>

    </g><!-- end transform group -->
  </g>

  <!-- Package name -->
  <text x="100" y="200" text-anchor="middle"
        font-family="Helvetica, Arial, sans-serif" font-weight="bold"
        font-size="36" fill="white" letter-spacing="4">grip</text>
</svg>
