<svg xmlns="http://www.w3.org/2000/svg" version="1.1" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="231"><svg viewBox="0 0 200 231" width="200" height="231">
  <defs>
    <clipPath id="hex-clip">
      <polygon points="100,2 193,59 193,172 100,229 7,172 7,59"></polygon>
    </clipPath>
  </defs>

  <!-- Hex border -->
  <polygon points="100,2 193,59 193,172 100,229 7,172 7,59" fill="#1F3B73" stroke="#0F1F40" stroke-width="3"></polygon>

  <!-- Network motif: large hub nodes connected to smaller clustered nodes -->
  <!-- Edges -->
  <g stroke="#6B8CC7" stroke-width="1.5" stroke-opacity="0.7" clip-path="url(#hex-clip)">
    <!-- Hub connections -->
    <line x1="100" y1="90" x2="60" y2="130"></line>
    <line x1="100" y1="90" x2="140" y2="130"></line>
    <line x1="100" y1="90" x2="100" y2="55"></line>
    <line x1="60" y1="130" x2="140" y2="130"></line>
    <!-- Cluster edges from left hub -->
    <line x1="60" y1="130" x2="38" y2="148"></line>
    <line x1="60" y1="130" x2="42" y2="112"></line>
    <line x1="60" y1="130" x2="55" y2="155"></line>
    <line x1="38" y1="148" x2="55" y2="155"></line>
    <line x1="38" y1="148" x2="42" y2="112"></line>
    <!-- Cluster edges from right hub -->
    <line x1="140" y1="130" x2="162" y2="148"></line>
    <line x1="140" y1="130" x2="158" y2="112"></line>
    <line x1="140" y1="130" x2="145" y2="155"></line>
    <line x1="162" y1="148" x2="145" y2="155"></line>
    <line x1="162" y1="148" x2="158" y2="112"></line>
    <!-- Top cluster -->
    <line x1="100" y1="55" x2="82" y2="42"></line>
    <line x1="100" y1="55" x2="118" y2="42"></line>
    <line x1="82" y1="42" x2="118" y2="42"></line>
    <line x1="100" y1="55" x2="100" y2="35"></line>
    <line x1="82" y1="42" x2="100" y2="35"></line>
    <line x1="118" y1="42" x2="100" y2="35"></line>
  </g>

  <!-- Hub nodes (larger) -->
  <g fill="white">
    <circle cx="100" cy="90" r="6"></circle>
    <circle cx="60" cy="130" r="5.5"></circle>
    <circle cx="140" cy="130" r="5.5"></circle>
    <circle cx="100" cy="55" r="5.5"></circle>
  </g>

  <!-- Small cluster nodes -->
  <g fill="#A8C4F0">
    <!-- Left cluster -->
    <circle cx="38" cy="148" r="3"></circle>
    <circle cx="42" cy="112" r="3"></circle>
    <circle cx="55" cy="155" r="3"></circle>
    <!-- Right cluster -->
    <circle cx="162" cy="148" r="3"></circle>
    <circle cx="158" cy="112" r="3"></circle>
    <circle cx="145" cy="155" r="3"></circle>
    <!-- Top cluster -->
    <circle cx="82" cy="42" r="3"></circle>
    <circle cx="118" cy="42" r="3"></circle>
    <circle cx="100" cy="35" r="3"></circle>
  </g>

  <!-- Package name -->
  <text x="100" y="200" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="38" fill="white" letter-spacing="4">grip</text>
</svg></svg>