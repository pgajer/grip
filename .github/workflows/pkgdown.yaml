name: pkgdown

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      RGL_USE_NULL: TRUE

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies for rgl and GIF rendering
        run: sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev libmagick++-dev

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgdown
            any::pkgload
            any::magick
            any::png
          needs: website

      - name: Build pkgdown site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = TRUE)
        shell: Rscript {0}

      # Publish generated GIFs with Pages; the README embeds these stable URLs.
      - name: Generate and stage gallery animations
        run: |
          make readme-assets
          mkdir -p docs/reference/figures
          cp man/figures/readme-sierpinski-*-trace.gif docs/reference/figures/
          cp man/figures/readme-saddle-reference.png docs/reference/figures/
          mkdir -p docs/supplements
          cp papers/grip-software-paper/supplement/S4-interactive-saddle.html docs/supplements/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
