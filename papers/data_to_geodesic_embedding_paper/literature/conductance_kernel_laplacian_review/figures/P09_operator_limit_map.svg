<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-labelledby="title desc">
  <title id="title">P09 graph Laplacian operator limits</title>
  <desc id="desc">Original explanatory diagram mapping Gaussian graph weights to continuum Laplace type operators under uniform, nonuniform, and normalized constructions.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #0f172a; }
      .title { font-size: 23px; font-weight: 700; }
      .small { font-size: 15px; }
      .tiny { font-size: 13px; fill: #475569; }
      .box { fill: #f8fafc; stroke: #64748b; stroke-width: 1.5; rx: 6; }
      .blue { fill: #eff6ff; stroke: #2563eb; }
      .green { fill: #ecfdf5; stroke: #059669; }
      .amber { fill: #fffbeb; stroke: #d97706; }
      .red { fill: #fef2f2; stroke: #dc2626; }
      .arrow { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 6 5; }
      .eq { font-family: "Courier New", monospace; font-size: 14px; }
    </style>
  </defs>

  <rect x="0" y="0" width="980" height="520" fill="#ffffff"/>
  <text x="40" y="46" class="title">P09: which graph Laplacian limit is being proved?</text>
  <text x="40" y="74" class="small">The paper studies complete Gaussian point-cloud Laplacians and their scaled limits as n -> infinity and t -> 0.</text>

  <rect x="45" y="120" width="250" height="92" class="box blue"/>
  <text x="68" y="151" class="small" font-weight="700">Point cloud samples</text>
  <text x="68" y="176" class="eq">x_1,...,x_n in M subset R^N</text>
  <text x="68" y="197" class="tiny">i.i.d. from uniform or density P</text>

  <rect x="365" y="112" width="265" height="108" class="box"/>
  <text x="389" y="143" class="small" font-weight="700">Unnormalized Gaussian graph</text>
  <text x="389" y="168" class="eq">w_ij = exp(-||x_i-x_j||^2/(4t))</text>
  <text x="389" y="190" class="eq">L^t_n f(x) = n^-1 sum_j w(x,x_j)</text>
  <text x="389" y="209" class="eq">              * (f(x)-f(x_j))</text>

  <rect x="710" y="78" width="225" height="84" class="box green"/>
  <text x="733" y="108" class="small" font-weight="700">Uniform sampling</text>
  <text x="733" y="134" class="eq">scaled L^t_n -></text>
  <text x="733" y="153" class="eq">(1/vol(M)) Delta_M f</text>

  <rect x="710" y="195" width="225" height="92" class="box amber"/>
  <text x="733" y="225" class="small" font-weight="700">Nonuniform sampling</text>
  <text x="733" y="251" class="eq">scaled L^t_n -></text>
  <text x="733" y="270" class="eq">P(x) Delta_{P^2} f</text>

  <rect x="365" y="318" width="265" height="122" class="box"/>
  <text x="389" y="349" class="small" font-weight="700">Normalized weights</text>
  <text x="389" y="374" class="eq">G_t(x,y) = (4 pi t)^(-k/2)</text>
  <text x="389" y="393" class="eq">             exp(-||x-y||^2/(4t))</text>
  <text x="389" y="414" class="eq">W = G_t / (t sqrt(dhat_t(x)dhat_t(y)))</text>

  <rect x="710" y="338" width="225" height="82" class="box green"/>
  <text x="733" y="368" class="small" font-weight="700">Normalized limit</text>
  <text x="733" y="394" class="eq">L^t_n f(p) -> Delta_P f(p)</text>
  <text x="733" y="413" class="tiny">density factor removed; drift remains</text>

  <rect x="45" y="332" width="250" height="76" class="box red"/>
  <text x="68" y="361" class="small" font-weight="700">Important scope boundary</text>
  <text x="68" y="386" class="tiny">This is continuum operator theory,</text>
  <text x="68" y="404" class="tiny">not SIMODS overlap-density smoothing.</text>

  <path d="M295 166 L365 166" class="arrow"/>
  <path d="M630 150 C665 130 680 120 710 120" class="arrow"/>
  <path d="M630 184 C665 210 681 232 710 241" class="arrow"/>
  <path d="M498 220 L498 318" class="arrow dash"/>
  <path d="M630 379 L710 379" class="arrow"/>
  <path d="M295 370 L365 370" class="arrow dash"/>

  <text x="56" y="476" class="tiny">Original figure for reviewer memo P09. Source concepts: Sections 2, 3, 5, and 5.1; Theorems 3.1, 3.3, 5.1, and 5.2.</text>
</svg>
