<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410" role="img" aria-labelledby="title desc">
  <title id="title">Three-node harmonic interpolation example</title>
  <desc id="desc">A path graph with endpoints fixed at zero and one and an unlabeled middle node whose harmonic value depends on conductance weights a and b.</desc>
  <rect x="0" y="0" width="900" height="410" fill="#ffffff"/>
  <style>
    .edge { stroke: #374151; stroke-width: 8; stroke-linecap: round; }
    .node { stroke: #111827; stroke-width: 3; }
    .label { font-family: Arial, Helvetica, sans-serif; font-size: 24px; fill: #111827; }
    .small { font-family: Arial, Helvetica, sans-serif; font-size: 20px; fill: #374151; }
    .math { font-family: Arial, Helvetica, sans-serif; font-size: 23px; fill: #111827; }
    .hint { font-family: Arial, Helvetica, sans-serif; font-size: 18px; fill: #4b5563; }
  </style>
  <line class="edge" x1="190" y1="150" x2="450" y2="150"/>
  <line class="edge" x1="450" y1="150" x2="710" y2="150"/>
  <circle class="node" cx="190" cy="150" r="48" fill="#dbeafe"/>
  <circle class="node" cx="450" cy="150" r="54" fill="#fef3c7"/>
  <circle class="node" cx="710" cy="150" r="48" fill="#fee2e2"/>
  <text class="label" x="158" y="158">f=0</text>
  <text class="label" x="414" y="158">f=?</text>
  <text class="label" x="678" y="158">f=1</text>
  <text class="small" x="295" y="122">w12 = a</text>
  <text class="small" x="555" y="122">w23 = b</text>
  <text class="small" x="123" y="230">labeled</text>
  <text class="small" x="377" y="238">unlabeled</text>
  <text class="small" x="646" y="230">labeled</text>
  <text class="math" x="195" y="300">Harmonic condition at node 2:</text>
  <text class="math" x="520" y="300">f2 = (a*0 + b*1)/(a+b) = b/(a+b)</text>
  <text class="hint" x="195" y="330">Increasing the conductance to the right endpoint pulls the interpolated value</text>
  <text class="hint" x="195" y="355">toward label 1; increasing the left conductance pulls it toward label 0.</text>
</svg>
