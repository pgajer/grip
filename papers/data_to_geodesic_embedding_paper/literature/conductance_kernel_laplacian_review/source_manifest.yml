schema:
  purpose: "Source manifest for H005 conductance/kernel graph-Laplacian literature review."
  access_date: "2026-05-15"
  canonical_reading_copy_values:
    - true
    - false
  required_fields:
    - id
    - tier
    - citation_key
    - title
    - authors
    - year
    - original_url
    - doi
    - arxiv_id
    - local_path
    - access_date
    - canonical_reading_copy
    - sha256
    - pages
    - notes
  evidence_labels:
    - explicit
    - derived
    - contextual
    - uncertain
  figure_policy: >
    Internal paper-review memos may include copied paper figures only when the
    figure materially helps explain the paper's method, theory, experiment, or
    conductance/kernel choice. Every copied figure must be labeled as reproduced
    from the reviewed paper, with citation, figure number, page or section
    reference, and a short explanation of why it is included. Reviewers are
    encouraged to create original explanatory figures from equations or concepts
    on toy examples when that better serves a mathematically capable
    non-specialist reader.

