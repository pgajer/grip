metadata:
  title: "SIMODS Figure/Table Readiness Registry"
  version: 1
  updated: "2026-05-15"
  description: >
    Source registry for candidate and needed figures, tables, interactives, and
    planned visual assets for the SIMODS manuscript. Generated HTML should be
    rebuilt with scripts/build_figure_table_readiness_board.py.

schema:
  allowed_kinds: ["figure", "table", "interactive", "planned"]
  allowed_statuses:
    - "ready"
    - "usable_with_edits"
    - "needs_redraw"
    - "needs_distillation"
    - "needed"
    - "supplement_only"
    - "background_only"
    - "deprecated"
  allowed_main_or_supplement:
    - "main"
    - "supplement"
    - "background"
    - "internal"

