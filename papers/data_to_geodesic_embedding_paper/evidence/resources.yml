metadata:
  title: "Data-to-Geodesic Embedding Paper Resource Registry"
  version: 1
  updated: "2026-05-15"
  description: >
    Source registry for reusable manuscript resources: LaTeX manuscripts,
    reports, dashboards, figures, experiment reports, and planning notes that
    may supply formulas, prose, results, or figures for the SIMODS paper.

schema:
  allowed_readiness_values:
    - "ready to cite internally"
    - "usable with edits"
    - "needs distilled figure/table"
    - "background or supplement"
    - "background or discussion"
    - "archive/deprecated"
    - "source of planning truth"
    - "active planning artifact"
    - "active audit artifact"
    - "background"
  allowed_manuscript_relevance:
    - "reusable for main text"
    - "supplement/background"
    - "archive/deprecated"
    - "internal/project management"
  allowed_resource_roles:
    - "canonical"
    - "supporting"
    - "historical"
    - "internal"

