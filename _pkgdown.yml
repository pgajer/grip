url: https://pgajer.github.io/grip/

template:
  bootstrap: 5
  light-switch: true
  bslib:
    primary: "#0054AD"
    border-radius: 0.5rem
    btn-border-radius: 0.25rem
    danger: "#A6081A"

home:
  sidebar:
    structure:
      - links
      - license
      - community
      - authors
      - dev

navbar:
  structure:
    left:
      - intro
      - reference
      - articles
      - changelog
    right:
      - github
  components:
    intro:
      text: Get started
      href: index.html
    articles:
      text: Articles
      menu:
        - text: Getting Started
          href: articles/grip-examples.html
        - text: Weighted Layouts
          href: articles/weighted-grip-intro.html
        - text: Choosing Layouts for Real Data
          href: articles/grip-real-data.html
        - text: Tracing and Diagnostics
          href: articles/grip-trace-and-diagnostics.html
        - text: Interactive Explorer
          href: articles/gripui-explorer.html
        - text: HMP/U01 Case Study
          href: articles/hmp-u01-case-study.html
        - text: "Comparing with Alternatives"
          href: articles/grip-vs-alternatives.html
        - text: "---"
        - text: Gallery
          href: articles/gallery.html
    changelog:
      text: Changelog
      href: news/index.html
    github:
      icon: fa-github
      href: https://github.com/pgajer/grip
      aria-label: GitHub

reference:
  - title: Layout computation
    desc: Compute graph layouts using the multiscale GRIP algorithm.
    contents:
      - grip.layout
      - grip.layout.globalrep
      - grip.layout.legacy
      - grip.layout.trace
      - grip.layout.trace.legacy

  - title: Quality metrics
    desc: Score and compare layouts across seeds and parameter settings.
    contents:
      - grip.score.layout
      - grip.geometry.diagnostics
      - grip.compare.layouts
      - grip.params.from.summary

  - title: Landmark geodesic KK
    desc: Prepare, score, and optimize layouts with the sparse landmark-geodesic KK objective.
    contents:
      - grip.prepare.landmark.geodesic.kk
      - grip.score.landmark.geodesic.kk
      - grip.optimize.landmark.geodesic.kk

  - title: Weighted layout computation
    desc: Compute geometry-aware layouts and multiscale filtrations for weighted graphs.
    contents:
      - grip.layout.weighted
      - grip.layout.globalrep.weighted
      - grip.layout.trace.weighted
      - grip.build.misf
      - grip.build.misf.weighted

  - title: Full geodesic KK
    desc: Prepare, score, and optimize layouts under the full geodesic Kamada-Kawai objective.
    contents:
      - grip.prepare.geodesic.kk
      - grip.score.geodesic.kk
      - grip.optimize.geodesic.kk

  - title: Geodesic MDS
    desc: Prepare, score, and optimize layouts under the geodesic-MDS objective.
    contents:
      - grip.prepare.geodesic.mds
      - grip.prepare.graph.geodesic.mds
      - grip.score.geodesic.mds
      - grip.optimize.geodesic.mds

  - title: MISF Geodesic MDS
    desc: Prepare and optimize multiscale geodesic-MDS layouts using MISF hierarchies.
    contents:
      - grip.prepare.misf.geodesic.mds
      - grip.score.misf.geodesic.mds
      - grip.optimize.misf.geodesic.mds
      - grip.geodesic.misf.induced_level_graph
      - grip.geodesic.misf.solve.top.level

  - title: Visualization
    desc: Plot layouts in 2D and 3D.
    contents:
      - grip.plot
      - grip.project.3d

  - title: Graph generators
    desc: Build common graph families as edge-list matrices.
    contents:
      - edges.mesh
      - edges.cycle
      - edges.path
      - edges.cylinder
      - edges.torus
      - edges.kary.tree
      - edges.sierpinski.triangle
      - edges.sierpinski.tetrahedron
      - edges.sierpinski.carpet

  - title: Surface family helpers
    desc: Helper topics for weighted surface, solid, occupied-mesh, and tree graph families.
    contents:
      - mesh_surface_helpers
      - cylinder_surface_helpers
      - sphere_surface_helpers
      - torus_surface_helpers
      - irregular_rectangle_surface_helpers
      - irregular_annulus_surface_helpers
      - irregular_sphere_surface_helpers
      - irregular_torus_surface_helpers
      - irregular_double_torus_surface_helpers
      - irregular_pair_of_pants_surface_helpers
      - irregular_ball_solid_helpers
      - irregular_shell_solid_helpers
      - triangulated_annulus_surface_helpers
      - triangulated_pair_of_pants_surface_helpers
      - triangulated_polyhedron_surface_helpers
      - occupied_mesh_surface_helpers
      - perforated_grid_helpers
      - kary_tree_weighted_graph_helpers

  - title: Recursive and fractal family helpers
    desc: Helper topics for recursive masks, porous families, and self-similar graph generators.
    contents:
      - mask_pattern_helpers
      - cube_mask_pattern_helpers
      - triangle_mask_helpers
      - tetrahedron_mask_helpers
      - recursive_mask_grid_surface_helpers
      - recursive_cube_mask_surface_helpers
      - recursive_triangle_mask_surface_helpers
      - recursive_tetrahedron_mask_surface_helpers
      - porous_cube_surface_helpers
      - sierpinski_carpet_surface_helpers
      - sierpinski_triangle_surface_helpers
      - sierpinski_tetrahedron_surface_helpers
      - menger_sponge_surface_helpers
      - vicsek_surface_helpers

  - title: Interactive explorer
    desc: Shiny-based layout browser for interactive exploration.
    contents:
      - gripui_app
      - run_gripui
      - gripui_project
      - gripui_project_from_compare
      - gripui_project_from_dir
      - gripui_validate_project
      - gripui_family_app
      - run_gripui_family
      - gripui_graph_family_catalog
      - gripui_paraboloid_gmds_app
      - run_gripui_paraboloid_gmds

  - title: Data
    desc: Bundled datasets for examples and vignettes.
    contents:
      - hmp.u01.gc.coarse

  - title: Package
    contents:
      - grip-package
