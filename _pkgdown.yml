url: https://pgajer.github.io/grip/

template:
  bootstrap: 5
  light-switch: true
  includes:
    before_body: |
      <aside class="grip-version-note" aria-label="Documentation version">
        <strong>Development documentation (0.2.0.9001).</strong>
        For the released package, use the <a href="https://cran.r-project.org/web/packages/grip/index.html">CRAN manual and vignettes</a>.
        In CRAN 0.2.0, <code>metric.mds()</code> performs classical scaling; this development version minimizes raw distance stress.
      </aside>
    in_header: |
      <link rel="icon" type="image/svg+xml" sizes="any" href="https://pgajer.github.io/grip/favicon.svg">
  bslib:
    primary: "#0054AD"
    border-radius: 0.5rem
    btn-border-radius: 0.25rem
    danger: "#A6081A"

home:
  sidebar:
    structure:
      - links
      - license
      - community
      - authors
      - dev

navbar:
  structure:
    left: [intro, gallery, guides, cases, reference]
    right: [changelog, github]
  components:
    intro:
      text: Get started
      href: articles/grip-examples.html
    gallery:
      text: Graph gallery
      href: articles/synthetic-graph-families.html
    guides:
      text: Guides
      menu:
        - text: Finding your way around grip
          href: articles/function-guide.html
        - text: Choosing and evaluating a layout
          href: articles/grip-real-data.html
        - text: Layouts with meaningful edge lengths
          href: articles/weighted-grip-intro.html
        - text: Metric MDS
          href: articles/metric-mds-backends.html
        - text: Sparse SGD
          href: articles/sparse-metric-mds.html
        - text: Tracing and diagnostics
          href: articles/grip-trace-and-diagnostics.html
    cases:
      text: Explore further
      menu:
        - text: HMP/U01 biological network
          href: articles/hmp-u01-case-study.html
        - text: Interactive exploration with gripui
          href: articles/gripui-explorer.html
        - text: Complete results and further examples
          href: articles/index.html
    changelog:
      text: Changelog
      href: news/index.html
    github:
      icon: fa-github
      href: https://github.com/pgajer/grip
      aria-label: GitHub

articles:
  - title: Start here
    contents: [grip-examples, function-guide, synthetic-graph-families]
  - title: Choose and understand layouts
    contents: [grip-real-data, weighted-grip-intro, metric-mds-backends, sparse-metric-mds, grip-trace-and-diagnostics]
  - title: Case study and exploration
    contents: [hmp-u01-case-study, gripui-explorer]
  - title: Complete results and further examples
    contents: [graph-gallery-more, metric-mds-results, sparse-mds-results, grip-vs-alternatives]

redirects:
  - [articles/gallery.html, articles/synthetic-graph-families.html#constructing-other-graph-families]
  - [articles/showcase-recipes.html, articles/grip-trace-and-diagnostics.html]

