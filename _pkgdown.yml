url: https://pgajer.github.io/grip/

template:
  bootstrap: 5
  light-switch: true
  includes:
    before_body: |
      <aside class="grip-version-note" aria-label="Documentation version">
        <strong>Development documentation (0.2.0.9001).</strong>
        For the released package, use the <a href="https://cran.r-project.org/web/packages/grip/index.html">CRAN manual and vignettes</a>.
        In CRAN 0.2.0, <code>metric.mds()</code> performs classical scaling; this development version minimizes raw distance stress.
      </aside>
    in_header: |
      <link rel="icon" type="image/svg+xml" sizes="any" href="https://pgajer.github.io/grip/favicon.svg">
  bslib:
    primary: "#0054AD"
    border-radius: 0.5rem
    btn-border-radius: 0.25rem
    danger: "#A6081A"

home:
  sidebar:
    structure:
      - links
      - license
      - community
      - authors
      - dev

navbar:
  structure:
    left:
      - intro
      - reference
      - articles
      - changelog
    right:
      - github
  components:
    intro:
      text: Get started
      href: articles/grip-examples.html
    articles:
      text: Articles
      menu:
        - text: Function Guide
          href: articles/function-guide.html
        - text: Synthetic Graph Examples
          href: articles/synthetic-graph-families.html
        - text: Getting Started
          href: articles/grip-examples.html
        - text: Weighted Layouts
          href: articles/weighted-grip-intro.html
        - text: Choosing Layouts for Real Data
          href: articles/grip-real-data.html
        - text: Tracing and Diagnostics
          href: articles/grip-trace-and-diagnostics.html
        - text: Interactive Explorer
          href: articles/gripui-explorer.html
        - text: HMP/U01 Case Study
          href: articles/hmp-u01-case-study.html
        - text: "Comparing with Alternatives"
          href: articles/grip-vs-alternatives.html
        - text: "---"
        - text: Showcase recipes
          href: articles/showcase-recipes.html
        - text: Gallery
          href: articles/gallery.html
    changelog:
      text: Changelog
      href: news/index.html
    github:
      icon: fa-github
      href: https://github.com/pgajer/grip
      aria-label: GitHub

